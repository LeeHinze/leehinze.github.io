<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09070f">
<title>Journal | Lee Hinze</title>
<style>
:root{--bg:#09070f;--card:#171121;--accent:#9d63ff;--light:#c9abff;--text:#f6f1ff;--muted:#aaa1ba;--border:rgba(201,171,255,.17)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;margin:0;color:var(--text);font-family:Inter,system-ui,sans-serif;background:var(--bg);line-height:1.65}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:inherit}.nav{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);background:rgba(9,7,15,.82);backdrop-filter:blur(18px)}.nav-inner,.wrap{width:min(calc(100% - 32px),1000px);margin:auto}.nav-inner{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;text-decoration:none;letter-spacing:-.03em}.brand span{color:var(--light)}.back{padding:9px 14px;color:var(--muted);border:1px solid var(--border);border-radius:10px;text-decoration:none;font-size:.86rem;font-weight:700;transition:.2s}.back:hover{color:#fff;border-color:var(--accent);transform:translateY(-2px)}
.wrap{padding:76px 0 90px}.eyebrow{color:var(--light);font-size:.76rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{max-width:720px;margin:12px 0 15px;font-size:clamp(3rem,7vw,5.5rem);line-height:1;letter-spacing:-.065em}.intro{max-width:630px;margin:0 0 42px;color:var(--muted);font-size:1.06rem}.search{width:100%;margin-bottom:22px;padding:14px 16px;color:var(--text);border:1px solid var(--border);border-radius:13px;outline:none;background:rgba(23,17,33,.8);font:inherit;transition:.2s}.search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(157,99,255,.12)}
.posts{display:block}.post{margin-bottom:14px;padding:25px;border:1px solid var(--border);border-radius:18px;background:#171121;box-shadow:0 18px 50px rgba(0,0,0,.2);transition:transform .25s,border-color .25s}.post:hover{transform:translateY(-5px);border-color:rgba(201,171,255,.42)}.post-top{display:flex;justify-content:space-between;gap:20px}.date{color:var(--light);font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.title{margin:5px 0 10px;font-size:1.3rem;font-weight:800;letter-spacing:-.025em}.content{max-width:780px;color:var(--muted);font-size:.94rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.open{flex:0 0 auto;align-self:center;padding:10px 14px;color:#fff;border-radius:10px;background:#7f49df;text-decoration:none;font-size:.82rem;font-weight:800;box-shadow:0 9px 25px rgba(111,54,207,.25)}.status{padding:26px;color:var(--muted);border:1px solid var(--border);border-radius:16px;background:#171121}footer{padding:24px;color:var(--muted);border-top:1px solid var(--border);text-align:center;font-size:.84rem}
@media(max-width:620px){.wrap{padding-top:54px}.post-top{display:block}.open{display:inline-block;margin-top:18px}h1{font-size:3.2rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="brand" href="../">Lee Hinze<span>.</span></a><a class="back" href="../">← Portfolio</a></div></nav>
<main class="wrap"><span class="eyebrow">Notes & progress</span><h1>Research journal.</h1><p class="intro">Thoughts, technical notes, and honest updates from my journey through cybersecurity and software development.</p><input class="search" id="search" type="search" placeholder="Search articles…" aria-label="Search articles"><div class="posts" id="postsRoot"><div class="status">Loading articles…</div></div></main>
<footer>© <span id="year"></span> Lee Hinze. Built with curiosity.</footer>
<script>
let allPosts=[];const root=document.querySelector('#postsRoot');const formatDate=d=>new Intl.DateTimeFormat('en',{year:'numeric',month:'long',day:'numeric'}).format(new Date(d));
function render(posts){root.replaceChildren();if(!posts.length){root.innerHTML='<div class="status">No articles match your search.</div>';return}posts.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(post=>{const article=document.createElement('article');article.className='post';const top=document.createElement('div');top.className='post-top';const copy=document.createElement('div');const date=document.createElement('div');date.className='date';date.textContent=formatDate(post.date);const title=document.createElement('div');title.className='title';title.textContent=post.title||'Untitled';const excerpt=document.createElement('div');excerpt.className='content';excerpt.textContent=post.content||'';const link=document.createElement('a');link.className='open';link.href='post.html?id='+encodeURIComponent(post.id);link.textContent='Read article →';copy.append(date,title,excerpt);top.append(copy,link);article.append(top);root.append(article)})}
fetch('./posts.json').then(r=>{if(!r.ok)throw new Error('Unable to load articles');return r.json()}).then(posts=>{allPosts=posts;render(posts)}).catch(error=>{root.innerHTML='<div class="status">'+error.message+'. Try serving the site through a local server.</div>'});
document.querySelector('#search').addEventListener('input',event=>{const q=event.target.value.trim().toLowerCase();render(allPosts.filter(post=>(post.title+' '+post.content).toLowerCase().includes(q)))});document.querySelector('#year').textContent=new Date().getFullYear();
</script>
</body>
</html>
